# docker-compose.yml — orchestrate FastAPI + DynamoDB-local + Prometheus

services:
  # FastAPI retrieval micro-service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrieval_app

    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --log-level info

    volumes:
      - ./data:/data                # index, metadata, embeddings, ...
      - ./scripts:/scripts:ro        # helper scripts (read-only)

    ports:
      - "8000:8000"                 # expose API on host:8000

    environment:
      # DynamoDB-local endpoint + default AWS region
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_DEFAULT_REGION: us-east-1

      # step-8 outputs
      FAISS_INDEX_PATH: /data/faiss-indexes/ivf_flat_1024.index
      META_PATH:        /data/id2meta.json      # converted JSON **array**
      NPROBE:           "16"                    # benchmark sweet-spot

    depends_on:
      - dynamodb-local

  # Lightweight in-memory DynamoDB for local testing
  dynamodb-local:
    image: amazon/dynamodb-local:1.21.0
    container_name: dynamodb_local
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "8001:8000"                 # avoid clashing with FastAPI (8000-->8001)
    working_dir: /home/dynamodblocal

  # Prometheus — scrapes metrics from FastAPI's /metrics endpoint
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
