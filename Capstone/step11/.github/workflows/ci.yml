name: CI

on:
  push:
    branches:
      - main
      - 'step11/**'
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      TAG: ${{ github.sha }}

    steps:
      # 1) Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3) Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests numpy

      # 4) Run unit tests
      - name: Run pytest
        run: pytest -q tests

      # 5) Prepare cache key for Docker buildx
      - name: Extract Docker layer cache key
        id: prep
        run: echo "cache_key=$(echo ${{ github.ref }} | tr / -)" >> $GITHUB_OUTPUT

      # 6) Cache Docker buildx layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.prep.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 7) Set up Docker buildx
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 8) Build (but don’t push) the Docker image
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          load: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # (Optional) uncomment these to push to ECR/GHCR on main
