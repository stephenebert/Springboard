name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-22.04    # GitHub-hosted runner (~2 vCPU, 7 GB RAM)

    steps:
    # 1. Checkout repo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2.  Set up Python & install deps
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # 3.  Run unit + integration tests (mini fixture)
    - name: Run pytest
      run: pytest -q tests

    # 4.  Build Docker image (layer-cache via actions/checkout)
    #      optional push to ECR if AWS creds are set
    - name: Set up QEMU           # multi-arch builder
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ECR (optional)
      if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build image
      run: |
        # Local tag
        docker build \
          --tag retrieval_app:ci-${{ github.sha }} \
          --file Dockerfile .
        docker images | head -n 5

    - name: Push image to ECR (optional)
      if: ${{ secrets.AWS_ECR_REPO != '' }}
      run: |
        IMAGE_URI="${{ secrets.AWS_ECR_REPO }}:ci-${{ github.sha }}"
        docker tag retrieval_app:ci-${{ github.sha }} $IMAGE_URI
        docker push $IMAGE_URI
