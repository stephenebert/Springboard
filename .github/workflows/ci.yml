name: CI

# run on pushes to main or any branch named step11/**
on:
  push:
    branches:
      - main
      - 'step11/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      TAG: ${{ github.sha }}

    steps:
      # 1) pull down the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) install Python, cache pip
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3) install everything (FastAPI, test deps, uvicorn)
      - name: Install dependencies
        working-directory: Capstone/step11
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # make sure uvicorn is present so we can spin up the service
          pip install uvicorn

      # 4) start your FastAPI app in the background
      - name: Launch FastAPI (uvicorn)
        working-directory: Capstone/step11
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 & 
          # wait a bit for it to come up
          sleep 5

      # 5) run your smoke & unit tests against the live server
      - name: Run pytest
        working-directory: Capstone/step11
        run: pytest -q tests

      # 6) prep a cache key for Docker buildx
      - name: Extract Docker layer cache key
        id: prep
        run: echo "cache_key=$(echo ${{ github.ref }} | tr / -)" >> $GITHUB_OUTPUT

      # 7) cache the buildx layers so rebuilds are fast
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.prep.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 8) set up docker/buildx
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 9) build your image (no push)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: Capstone/step11
          file: Capstone/step11/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          load: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache,mode=max

      # (Optional) you can add a “push” step here if on main…

