# .github/workflows/ci.yml
name: CI

# run on pushes to main or any branch under step11/**
on:
  push:
    branches:
      - main
      - 'step11/**'
  pull_request:
    branches:
      - main

jobs:
  # 1️  Run unit tests
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3. Install dependencies & pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests numpy

      # 4. Run pytest
      - name: Run pytest
        run: pytest -q tests/

  # 2️  Build (but don’t push) your Docker image, caching layers
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      TAG: ${{ github.sha }}
    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Cache Docker build layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 4. Build the image (load into local Docker daemon)
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # (Optional) you could add steps here to push to ECR/GHCR on main

