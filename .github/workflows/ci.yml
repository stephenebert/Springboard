# .github/workflows/ci.yml  (repo-root)
name: CI

on:
  push:
    branches: [main, 'step11/**']
  pull_request:
    branches: [main]

jobs:
# 1) test
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capstone/step11   # ← all commands happen here
    env:
      # point FastAPI at the toy index we committed for CI
      FAISS_INDEX_PATH: tests/fixtures/ivf_flat_1024.index
      META_PATH:       tests/fixtures/id2meta.json
      NPROBE:          1                    # anything is fine for CI

    steps:
    # 1. code checkout
    - uses: actions/checkout@v4

    # 2. Python
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest requests numpy

    # 3. Launch FastAPI (+ background)
    - name: Launch FastAPI (background)
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 & echo $! > server.pid
        # poll /health until it returns 200 (max 15 s)
        for i in {1..15}; do
          curl -s http://localhost:8000/health && exit 0 || sleep 1
        done
        echo "::error::Server failed to start"; cat server.pid; exit 1

    # 4. run tests
    - name: Run pytest
      run: pytest -q tests
      # always kill the background server
      if: always()
      continue-on-error: false

    # 5. Stop server (even if tests failed)
    - name: Stop FastAPI
      if: always()
      run: |
        kill -9 $(cat server.pid) || true

# 2) build  (only if tests succeeded)
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      TAG: ${{ github.sha }}
    defaults:
      run:
        working-directory: Capstone/step11

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to:   type=local,dest=/tmp/.buildx-cache,mode=max

