name: CI

on:
  push:
    branches:
      - main
      - 'step11/**'
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      TAG: ${{ github.sha }}

    steps:
      # 1) Checkout your code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3) Install Python dependencies
      - name: Install dependencies
        working-directory: Capstone/step11
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests numpy

      # 4) Run your unit tests
      - name: Run pytest
        working-directory: Capstone/step11
        run: pytest -q tests

      # 5) Prep a cache key for Docker layer caching
      - name: Extract Docker layer cache key
        id: prep
        run: echo "cache_key=$(echo ${{ github.ref }} | tr / -)" >> $GITHUB_OUTPUT

      # 6) Cache Docker buildx layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.prep.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 7) Set up Docker Buildx
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 8) Build your Docker image (no push)
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: Capstone/step11
          file: Capstone/step11/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          load: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # (Optionally, add steps here to push to GHCR/ECR when on main)
