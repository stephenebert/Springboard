# Springboard/.github/workflows/ci.yml

name: CI

# fire on pushes to main or any branch under step11/**
on:
  push:
    branches:
      - main
      - 'step11/**'
  pull_request:
    branches:
      - main

jobs:
  # 1) Run unit tests inside step11/
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Capstone/step11

    steps:
      # 1. Grab your code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Use Python 3.10 + cache pip
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3. Install your requirements + pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests numpy

      # 4. Run your tests
      - name: Run pytest
        run: pytest -q tests

  # 2) Build Docker image (but don't push it)
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: retrieval_app
      # we'll tag the image by the SHA
      TAG: ${{ github.sha }}

    steps:
      # 1. Checkout again
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Cache build layers in /tmp/.buildx-cache
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 4. Build the image (using the Dockerfile in step11/)
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: Capstone/step11
          file: Capstone/step11/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

