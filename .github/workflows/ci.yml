name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: Capstone/step11
        run: |
          pip install -r requirements.txt
          pip install pytest requests numpy faiss-cpu uvicorn fastapi

      - name: Launch FastAPI (background)
        working-directory: Capstone/step11
        env:
          FAISS_INDEX_PATH: tests/fixtures/data_small/ivf_flat_small.index
          META_PATH:        tests/fixtures/data_small/id2meta_small.json
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > server.pid

      - name: Wait for server
        working-directory: Capstone/step11
        run: sleep 3

      - name: Run pytest
        working-directory: Capstone/step11
        run: pytest -q tests
