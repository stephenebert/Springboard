# .github/workflows/ci.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Launch FastAPI (background)
        env:
          FAISS_INDEX_PATH: Capstone/step11/tests/fixtures/data_small/ivf_flat_small.index
          META_PATH:        Capstone/step11/tests/fixtures/data_small/id2meta_small.json
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 & echo $! > server.pid

      - name: Wait for server to be healthy
        run: sleep 2

      - name: Run pytest
        run: pytest -q Capstone/step11/tests
